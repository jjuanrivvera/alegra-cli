version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    # develop is the integration branch; without this dependabot targets the default
    # branch (main) and every bump leaves develop behind.
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    # develop is the integration branch; without this dependabot targets the default
    # branch (main) and every bump leaves develop behind.
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
