name: Spec sync

# Weekly refresh of the documented-API manifests from the official docs index:
# testdata/spec/endpoints.json (resource-level drift) and
# testdata/spec/schemas.json (field-level contract test). If either drifted,
# open a PR to develop for review. Network-bound, so it runs on a schedule,
# not on every PR — the committed manifests are what PRs check against
# (TestSpecManifest and TestContract_StructFieldsAreDocumented, network-free).
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh manifest
        run: go run ./tools/specsync
      - name: Open a PR on drift
        uses: peter-evans/create-pull-request@v8
        with:
          base: develop
          branch: chore/spec-sync
          add-paths: |
            testdata/spec/endpoints.json
            testdata/spec/schemas.json
          commit-message: "chore(spec): refresh API manifest"
          title: "chore(spec): documented API surface drifted"
          body: |
            Automated `specsync` detected changes in Alegra's documented API surface
            (`testdata/spec/endpoints.json` and `testdata/spec/schemas.json`). Review
            for new/removed endpoints the CLI may need to cover, and for field-level
            schema drift the contract test checks typed structs against.
