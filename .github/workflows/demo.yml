name: Demo GIF

# Regenerate assets/demo.gif from .demo/demo.tape. Manual trigger so it never
# commits to main on its own; run it from your working branch and it commits the
# refreshed GIF there, then open a PR as usual.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the demo binary (clean version)
        run: make build VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
      - uses: charmbracelet/vhs-action@v2
        with:
          path: .demo/demo.tape
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(demo): regenerate demo gif"
          file_pattern: assets/demo.gif
