site_name: Alegra CLI
site_description: Command-line interface for the Alegra accounting API
site_url: https://jjuanrivvera.github.io/alegra-cli/
repo_url: https://github.com/jjuanrivvera/alegra-cli
repo_name: jjuanrivvera/alegra-cli
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          site_name: Alegra CLI
          nav_translations:
            Home: Inicio
            Getting Started: Primeros pasos
            Installation: Instalación
            Authentication: Autenticación
            Quickstart: Inicio rápido
            Cookbook: Recetario
            Guides: Guías
            "Invoice → Cash": "Factura → Cobro"
            Expenses & Purchases: Gastos y compras
            Electronic Invoicing: Facturación electrónica
            Reporting & Month-End: Reportes y cierre de mes
            Productivity Features: Productividad
            Automation & Scripting: Automatización y scripting
            User Guide: Guía de uso
            Configuration & Profiles: Configuración y perfiles
            Output Formats: Formatos de salida
            Shell Completion: Autocompletado del shell
            Creating & Updating: Crear y actualizar
            Reference Catalogs: Catálogos de referencia
            Agent Skill: Skill para agentes
            MCP Server: Servidor MCP
            Agent Safety: Seguridad para agentes
            Reference: Referencia
            Command Reference: Referencia de comandos
            vs. Official MCP: vs. MCP oficial
            Errors & Rate Limits: Errores y límites de tasa
            FAQ & Troubleshooting: FAQ y solución de problemas
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Authentication: getting-started/authentication.md
      - Quickstart: getting-started/quickstart.md
  - Cookbook: cookbook.md
  - Guides:
      - Invoice → Cash: guides/invoice-to-cash.md
      - Expenses & Purchases: guides/expenses-and-purchases.md
      - Electronic Invoicing: guides/electronic-invoicing.md
      - Reporting & Month-End: guides/reporting-and-month-end.md
      - Productivity Features: guides/productivity.md
      - Automation & Scripting: guides/automation.md
  - User Guide:
      - Configuration & Profiles: user-guide/configuration.md
      - Output Formats: user-guide/output-formats.md
      - Shell Completion: user-guide/shell-completion.md
      - Creating & Updating: user-guide/writing-data.md
      - Reference Catalogs: user-guide/catalog.md
      - Agent Skill: user-guide/agent-skill.md
      - MCP Server: user-guide/mcp.md
      - Agent Safety: user-guide/agent-safety.md
  - Reference:
      - Command Reference: commands/index.md
      - vs. Official MCP: reference/vs-official-mcp.md
      - Errors & Rate Limits: reference/errors.md
      - FAQ & Troubleshooting: reference/faq.md
